name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.15.16
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install torch-free core + dev tools
        # The torch-free lane must never pull in torch; install only the base
        # package plus its [dev] extra (pytest), no [smpl]/[video]/[all].
        run: pip install -e ".[dev]"
      - name: Assert torch is absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None, "torch leaked into the torch-free lane"
          PY
      - name: Run torch-free core tests
        run: pytest -m "not torch and not smpl" -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          # The console entry point must work.
          /tmp/wheel-venv/bin/motion-studio --help
          # The installed package must ship the front-end static assets.
          /tmp/wheel-venv/bin/python - <<'PY'
          import importlib.resources as ir
          import motion_studio
          root = ir.files(motion_studio)
          for rel in ("static/index.html", "static/app.js"):
              path = root.joinpath(rel)
              assert path.is_file(), "missing packaged asset: %s" % rel
          print("packaged static assets present")
          PY
